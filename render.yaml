services:
  - type: worker
    name: queuectl-worker
    env: python
    buildCommand: "pip install -r requirements.txt && pip install ."
    startCommand: "python -m queuectl.cli.main worker run"
    envVars:
      - key: QUEUECTL_DB_PATH
        value: /tmp/queuectl/queue.db
      - key: QUEUECTL_LOG_DIR
        value: /tmp/queuectl/logs
