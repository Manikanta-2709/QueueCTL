services:
  - type: web
    name: queuectl-worker
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: QUEUECTL_DB_PATH
        value: /tmp/queuectl/queue.db
      - key: QUEUECTL_LOG_DIR
        value: /tmp/queuectl/logs
